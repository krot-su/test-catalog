x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    <<: *restart
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing local/products;
        mc anonymous set download local/products;
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY";
        mc admin policy attach local readwrite --user "$$S3_ACCESS_KEY" || true

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: products
      MEDIA_BASE_URL: /media
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    <<: *restart
    environment: *api-env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      retries: 5

  bot:
    build: ./bot
    <<: *restart
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      WEBAPP_URL: ${PUBLIC_URL}
      WEBHOOK_BASE_URL: ${PUBLIC_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./web
    <<: *restart
    environment:
      API_INTERNAL_URL: http://api:8000
    deploy:
      replicas: 2
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    <<: *restart
    ports:
      - "127.0.0.1:${HTTP_PORT:-8085}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
