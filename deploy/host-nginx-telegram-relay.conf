# Host nginx: Bot API relay for the bot containers (TELEGRAM_API_BASE=http://host.docker.internal:8086).
# The hosting provider blocks Telegram over IPv4; the host reaches it over IPv6, Docker containers have no IPv6.
# The bot token is part of the request path, so access logging is off and only local/Docker sources are allowed.

server {
    listen 8086;
    server_name _;

    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;

    access_log off;
    client_max_body_size 50m;

    resolver 127.0.0.53 ipv4=off valid=300s;
    set $telegram api.telegram.org;

    location / {
        proxy_pass https://$telegram;
        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.telegram.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
}
