# Host nginx: Bot API relay for the bot containers (TELEGRAM_API_BASE=http://host.docker.internal:8086).
# The hosting provider blocks Telegram over IPv4; the host reaches it over IPv6, Docker containers have no IPv6.
# The bot token is part of the request path (error_log lines include it too), so logging is off
# and only local/Docker sources are allowed.

# IPv6 connects to Telegram fail now and then on this host. The same address is listed three times so that
# nginx retries a failed connect; a request that never reached Telegram is safe to resend.
upstream telegram_api {
    zone telegram_api 64k;
    resolver 127.0.0.53 ipv4=off valid=300s;
    server api.telegram.org:443 resolve max_fails=0;
    server api.telegram.org:443 resolve max_fails=0;
    server api.telegram.org:443 resolve max_fails=0;
}

server {
    listen 8086;
    server_name _;

    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;

    access_log off;
    error_log /dev/null;
    client_max_body_size 50m;

    location / {
        proxy_pass https://telegram_api;
        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.telegram.org;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 90s;
    }
}
