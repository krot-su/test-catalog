# Host nginx vhost: TLS for aisnab.gmcloud.ru, traffic goes to the project's nginx on 127.0.0.1:8085.
# Certificate: acme.sh webroot /var/www/acme (renewed by acme.sh cron, reloadcmd "systemctl reload nginx").

server {
    listen 185.207.66.98:80;
    listen [::]:80;
    server_name aisnab.gmcloud.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aisnab.gmcloud.ru;

    ssl_certificate     /root/.acme.sh/aisnab.gmcloud.ru_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/aisnab.gmcloud.ru_ecc/aisnab.gmcloud.ru.key;

    # The catalog is opened inside Telegram WebView, so no X-Frame-Options here.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
