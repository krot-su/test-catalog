name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  bot-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import bot.main"

  stack-smoke:
    needs: [backend-tests, bot-import]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack without the bot (it needs a real token and public HTTPS)
        run: |
          cp .env.example .env
          docker compose up -d --build api web nginx
      - name: Smoke test
        run: CHECK_FAILOVER=1 bash scripts/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
