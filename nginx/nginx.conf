upstream web {
    zone web 64k;
    server web:3000 resolve;
}

upstream api {
    zone api 64k;
    server api:8000 resolve;
}

upstream bot {
    zone bot 64k;
    server bot:8080 resolve;
}

upstream minio {
    zone minio 64k;
    server minio:9000 resolve;
}

# Docker DNS returns every replica of a service; re-resolve so scaled or restarted
# containers join the round-robin without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Inside the Docker network a live replica accepts instantly; a stopped one must not hang the request.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;

    location /api/ {
        proxy_pass http://api;
    }

    location = /tg/webhook {
        proxy_pass http://bot;
    }

    location = /media/ {
        return 404;
    }

    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_set_header Host minio:9000;
        proxy_pass http://minio/products/;
    }

    location / {
        proxy_pass http://web;
    }
}
